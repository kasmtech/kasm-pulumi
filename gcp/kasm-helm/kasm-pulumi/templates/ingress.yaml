apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.kasmApp.name | default "kasm" }}-ingress
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.kasmApp.name }}-ingress
{{- include "kasm.defaultLabels" . | indent 4 }}
{{- if eq .Values.global.pulumiDeployment.cloudProvider "gcp" }}
  annotations:
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.global.pulumiDeployment.loadBalancerIP }}
    ingress.gcp.kubernetes.io/pre-shared-cert: {{ .Values.global.pulumiDeployment.cert }}
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.allow-http: "false"
{{- end }}
spec:
{{- if .Values.global.ingressClassName }}
  ingressClassName: {{ .Values.global.ingressClassName }}
{{- end }}
  rules:
  - host: {{ .Values.global.hostname | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kasm-proxy
            port:
              number: 8080
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: kasm-api
            port:
              number: 8080
{{- if .Values.kasmApp.servicesToDeploy.kasmShare.deploy }}
      - path: /api/share/
        pathType: Prefix
        backend:
          service:
            name: kasm-share
            port:
              number: 8182
{{- end }}