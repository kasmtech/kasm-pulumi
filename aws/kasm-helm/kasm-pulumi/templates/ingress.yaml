apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.kasmApp.name | default "kasm" }}-ingress
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.kasmApp.name }}-ingress
{{- include "kasm.defaultLabels" . | indent 4 }}
{{- if eq .Values.global.pulumiDeployment.cloudProvider "gcp" }}
  annotations:
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.global.pulumiDeployment.loadBalancerIP }}
{{- else if eq .Values.global.pulumiDeployment.cloudProvider "aws" }}
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.global.pulumiDeployment.certificateArn }}
{{- end }}
spec:
{{- if .Values.global.ingressClassName }}
  ingressClassName: {{ .Values.global.ingressClassName }}
{{- end }}
  tls:
  - hosts:
      - {{ .Values.global.hostname | quote }}
      {{- if gt (len .Values.global.altHostnames) 0 }}
        {{- range .Values.global.altHostnames }}
      - {{ . | quote }}
      {{- end }}
      {{- end }}
    secretName: {{ .Values.kasmCerts.ingress.name }}
  rules:
  - host: {{ .Values.global.hostname | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kasm-proxy
            port:
              number: 8080
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: kasm-api
            port:
              number: 8080
{{- if .Values.kasmApp.servicesToDeploy.kasmShare.deploy }}
      - path: /api/share/
        pathType: Prefix
        backend:
          service:
            name: kasm-share
            port:
              number: 8182
{{- end }}